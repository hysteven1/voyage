version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directories:
      - /services/trip-service
      - /services/planning-worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/trip-service
      - /services/planning-worker
    schedule:
      interval: weekly
