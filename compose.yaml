services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyage_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-voyage}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U voyage -d voyage
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    user: "0:0"
    entrypoint: ["temporal"]
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - namespace
        - describe
        - --namespace
        - default
        - --address
        - localhost:7233
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ./services/trip-service
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://voyage:${POSTGRES_PASSWORD:-voyage_local_dev}@postgres:5432/voyage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./services/trip-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: trip-service
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_PLANNING_MODEL: ${OPENAI_PLANNING_MODEL:-gpt-6.1-sol}
      DATABASE_URL: postgresql+psycopg://voyage:${POSTGRES_PASSWORD:-voyage_local_dev}@postgres:5432/voyage
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  worker:
    build:
      context: ./services/planning-worker
    restart: unless-stopped
    environment:
      SERVICE_NAME: planning-worker
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://voyage:${POSTGRES_PASSWORD:-voyage_local_dev}@postgres:5432/voyage
      TEMPORAL_ADDRESS: temporal:7233
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_PLANNING_MODEL: ${OPENAI_PLANNING_MODEL:-gpt-6.1-sol}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  temporal_data:
