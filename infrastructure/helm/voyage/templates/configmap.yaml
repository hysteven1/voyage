apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voyage.name" . }}
  labels:
    {{- include "voyage.labels" . | nindent 4 }}
data:
  TEMPORAL_ADDRESS: {{ required "config.temporalAddress is required" .Values.config.temporalAddress | quote }}
  TEMPORAL_NAMESPACE: {{ required "config.temporalNamespace is required" .Values.config.temporalNamespace | quote }}
  TEMPORAL_TLS: {{ .Values.config.temporalTls | quote }}
  OPENAI_MODEL: {{ .Values.config.openaiModel | quote }}
  OPENAI_PLANNING_MODEL: {{ .Values.config.openaiPlanningModel | quote }}
  OPENAI_RECOVERY_MODEL: {{ .Values.config.openaiRecoveryModel | quote }}
  WORKER_MAX_CONCURRENT_ACTIVITIES: {{ .Values.worker.maxConcurrentActivities | quote }}
