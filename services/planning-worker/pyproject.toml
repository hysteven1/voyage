[project]
name = "planning-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hysteven1", email = "hy.steven1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20260905",
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0,<3.0",
    "temporalio>=1.34.0",
    "tzdata>=2026.5",
]

[project.scripts]
planning-worker = "planning_worker:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
