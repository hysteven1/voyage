[project]
name = "trip-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0,<3.0",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trip-service = "trip_service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
